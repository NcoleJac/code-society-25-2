<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="contact.css">
</head>

<body class="container">
    <header>
        <h1>Contact Us</h1>
        <p>We’d love to hear from you! Please leave your name, email, and a short message, and one of our team members will get back to you as soon as possible.</p>
    </header>
 <div class="form">
        <label id="name-label" for="name">Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          required
        />
      </div> 
      <div class="form">
        <label id="email-label" for="email">Email:</label>
        <input
          type="text"
          id="email"
          name="email"
          placeholder="Enter your email address"
          required
        />
      </div>
      <div class="form">
        <label id="age-label" for="age">Age:</label>
        <input
          type="text"
          id="age"
          name="age"
          placeholder="Enter your age"
          required
        />
      </div>
       <div class="form">
        <label id="phone-number-label" for="phone-number">Phone Number:</label>
        <input
          type="text"
          id="phone-number"
          name="phone-number"
          placeholder="Enter your phone number"
          required
        />
      </div>
       <div class="form">
        <label for="message">Message:</label>
    <input
          id="message"
          name="message"
          rows="4"
          placeholder="Tell us how we can help you..."
          />
      </div>

     
        <button>Submit</button>
    </section>

</body>
    </html>
